# PostgreSQL Client Authentication Configuration
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local connections - use trust for container internal
local   all             postgres                                trust
local   all             all                                     trust

# IPv4 local loopback - use trust for development
host    all             postgres        127.0.0.1/32            trust
host    all             all             127.0.0.1/32            trust

# IPv6 local loopback - use trust for development
host    all             postgres        ::1/128                 trust
host    all             all             ::1/128                 trust

# Docker network - use trust for development
host    all             postgres        172.16.0.0/12           trust
host    all             all             172.16.0.0/12           trust

# Allow replication connections
host    replication     postgres        127.0.0.1/32            trust
host    replication     postgres        ::1/128                 trust
